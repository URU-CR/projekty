<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="app-version" content="1.10.1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projekty – ÚRÚ ČR</title>
<link rel="icon" href="favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=3">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="mask-icon" href="safari-pinned-tab.svg?v=3" color="#d6262b">
<meta name="theme-color" content="#d6262b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Orbitron:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --line:#dfe3e8; --line2:#eef0f3; --text:#1b222c; --muted:#6a7381;
  --accent:#1f5fbf; --accent-soft:#e3ecfa; --weekend:rgba(20,30,50,.045); --today:#d6453d;
  --critical:#e60012; --shadow:0 1px 2px rgba(0,0,0,.06); --leftw:520px; --rowh:34px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181d; --panel:#1d2128; --line:#2c323b; --line2:#252a32; --text:#e7eaee; --muted:#98a1ad;
    --accent:#6b9cf0; --accent-soft:#24314a; --weekend:rgba(255,255,255,.045); --today:#f0655b; --critical:#ff2e3b;
  }
}
:root[data-theme="dark"]{
  --bg:#15181d; --panel:#1d2128; --line:#2c323b; --line2:#252a32; --text:#e7eaee; --muted:#98a1ad;
  --accent:#6b9cf0; --accent-soft:#24314a; --weekend:rgba(255,255,255,.045); --today:#f0655b; --critical:#ff2e3b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:600;font-size:15px;letter-spacing:-.01em;padding-right:6px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tab{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 10px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tab:hover{background:var(--bg)}
.tab.on{background:var(--accent-soft);color:var(--text);border-color:transparent}
.tab .pd{width:9px;height:9px;border-radius:3px;display:inline-block}
.tab.add{color:var(--muted);font-weight:500}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--text)}
.tools select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px;max-width:160px}
.chk{display:flex;align-items:center;gap:5px;color:var(--muted);padding:0 4px;cursor:pointer;user-select:none}
.menu{position:relative}
.menu ul{display:none;position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:8px;list-style:none;margin:0;padding:4px;min-width:200px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.menu.open ul{display:block}
.menu li button{width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px}
.menu li button:hover{background:var(--bg)}
.menu li.sep{border-top:1px solid var(--line);margin:4px 0}
.menu li button.danger{color:var(--critical)}

/* gantt */
.gantt{flex:1;overflow:auto;position:relative;display:flex;align-items:flex-start;background:var(--panel)}
.gantt.narrow{--leftw:300px}
.left{position:sticky;left:0;z-index:3;width:var(--leftw);flex:none;background:var(--panel);border-right:2px solid var(--line)}
.splitter{position:absolute;top:0;bottom:0;right:-4px;width:8px;cursor:col-resize;z-index:7;touch-action:none}
.splitter:hover,.splitter.on{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.lhead{position:sticky;top:0;z-index:4;height:48px;display:grid;align-items:end;background:var(--panel);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;padding-bottom:6px}
.lhead span,.lrow>span{padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-name .nm{font-weight:500;font-size:13.5px}
.c-resp select{color:var(--muted);font-size:12px}
.lrow{display:grid;align-items:center;height:var(--rowh);border-bottom:1px solid var(--line2)}
.lrow:hover{background:var(--bg)}
.lrow.proj{background:var(--bg);font-weight:600;height:var(--rowh)}
.lrow.proj .c-name{gap:8px}
.lrow.crit .c-n{color:var(--critical);font-weight:600}
.lrow input,.lrow select{border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 4px;width:100%;min-width:0}
.lrow input:hover,.lrow select:hover{border-color:var(--line)}
.lrow input:focus,.lrow select:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.lrow input[type=date]{font-size:12px}
.c-prog input[type=checkbox]{width:15px;height:15px;margin:0;accent-color:var(--accent);flex:none}
.lrow input[type=number]{text-align:right;padding:3px 2px;-moz-appearance:textfield;appearance:textfield}
.lrow input[type=number]::-webkit-outer-spin-button,.lrow input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.c-prog{text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:2px}
.c-prog select.prsel{width:46px;padding:2px 0 2px 2px;font-size:12px}
.c-n{color:var(--muted);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.c-name{display:flex;align-items:center;gap:4px}
.c-name .ind{width:0;flex:none}
.c-name .ind{width:calc(var(--lv,0)*22px)}
.tg{border:0;background:none;width:16px;flex:none;color:var(--muted);padding:0;font-size:10px}
.tg.none{visibility:hidden}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.grp .nm{font-weight:600}
.lvl0.grp .nm{font-size:14px}
.crit .nm{color:var(--critical);font-weight:500}
.ms .dot{transform:rotate(45deg);border-radius:1px;width:8px;height:8px}
.c-act button{border:0;background:none;color:var(--muted);padding:2px 4px;border-radius:4px;visibility:hidden}
.lrow:hover .c-act button{visibility:visible}
.c-act button:hover{background:var(--accent-soft);color:var(--text)}
.c-days{text-align:right;color:var(--muted)}
.nt{color:var(--muted);font-size:11px;flex:none}
.bar .lbl b{font-weight:500;display:none}
.bar .lbl i.dt{color:var(--muted);font-size:11px}

.right{flex:none;position:relative}
.rhead{position:sticky;top:0;z-index:2;height:48px;background:var(--panel);border-bottom:1px solid var(--line)}
.mrow,.drow{position:relative;height:24px}
.mrow span{position:absolute;top:0;height:24px;line-height:24px;border-left:1px solid var(--line);padding-left:6px;font-weight:500;white-space:nowrap;overflow:hidden}
.drow span{position:absolute;top:0;height:24px;line-height:24px;font-size:11px;color:var(--muted);text-align:center;border-left:1px solid var(--line2);white-space:nowrap;overflow:hidden}
.drow span.we{background:var(--weekend)}
.drow span.td{color:var(--today);font-weight:600}
.rbody{position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--rowh) - 1px),var(--line2) calc(var(--rowh) - 1px),var(--line2) var(--rowh))}
.col{position:absolute;top:0;bottom:0}
.col.we{background:var(--weekend)}
.col.td{background:none;border-left:2px dashed var(--today);opacity:.9;z-index:3}
/* deadline projektu: plná červená linka přes graf + 🔥 v časové ose; odpočet v záhlaví */
.col.dl{background:none;border-left:2px solid var(--critical);z-index:3;opacity:.85}
.dlm{position:absolute;top:0;height:48px;display:flex;align-items:flex-start;gap:3px;transform:translateX(-9px);z-index:5;pointer-events:auto;white-space:nowrap}
.dlm .fl{font-size:15px;line-height:22px;filter:drop-shadow(0 0 2px #fff)}
.dlm b{font-size:11px;color:var(--critical);line-height:22px;font-weight:600}
#cd{display:inline-flex;gap:6px}
.cdp{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--critical);color:var(--critical);border-radius:6px;padding:2px 9px 2px 6px;font-size:12px;white-space:nowrap}
.cdp i{font-style:normal;font-size:11px;font-weight:600}
.cdp b{font-family:'Orbitron',ui-monospace,monospace;font-weight:600;font-size:13px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.cdp b u{text-decoration:none;font-size:9px;margin:0 3px 0 1px;opacity:.8;font-family:'IBM Plex Sans',sans-serif}
.flame{display:inline-block;vertical-align:-3px}
.dlm .fl{color:var(--critical)}
/* cizí termín */
.col.ext{background:none;border-left:2px dashed #7c3aed;z-index:3;opacity:.8}
.extm{position:absolute;top:26px;height:22px;transform:translateX(-50%);z-index:5;white-space:nowrap;pointer-events:auto}
.extm b{font-size:10.5px;color:#7c3aed;background:var(--panel);border:1px solid #c4b5fd;border-radius:4px;padding:1px 6px;max-width:160px;overflow:hidden;text-overflow:ellipsis;display:inline-block;line-height:16px}
/* denní kontrola (fronta) */
#kdlg{width:min(900px,96vw);max-width:none}
#kdlg .kk{font-size:11px;margin-left:auto;margin-right:10px}
#kdlg .kbody{padding:6px 10px 12px;max-height:72vh;overflow:auto}
.kr{display:grid;grid-template-columns:22px 1fr 90px 56px 14px 28px 28px;gap:8px;align-items:center;padding:7px 8px;border-radius:7px;border-bottom:1px solid var(--line2)}
.kr.sel{background:var(--accent-soft);outline:1px solid var(--accent)}
.kr .dm{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line);background:var(--panel);color:transparent;font-size:12px;font-weight:700;cursor:pointer;box-sizing:border-box}
.kr .dm:hover{border-color:var(--muted)}
.kr .dm.chk{background:#d1fae5;border-color:#34c38f;color:#047857}.kr .dm.chk.d1{opacity:.6}.kr .dm.chk.d2{opacity:.3}
.kr .kn{display:flex;flex-direction:column;gap:1px;min-width:0}
.kr .kn b{cursor:pointer}.kr .kn b:hover{color:var(--accent)}
.kr .kn .hint{font-size:11px}
.kr .kq{font-size:12px;color:#7a5200;background:#fff3b0;border-radius:4px;padding:0 6px;align-self:flex-start;margin-top:2px}
.kr .kl{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kr .kp{width:52px;border:1px solid var(--line);border-radius:5px;padding:3px 4px;font-size:13px;text-align:right;background:var(--bg)}
.kr .pc{color:var(--muted);font-size:11px;margin-left:-6px}
.kr .kb{border:1px solid var(--line);background:var(--panel);border-radius:5px;width:28px;height:26px;cursor:pointer;color:var(--muted);font-size:13px}
.kr .kb:hover{border-color:var(--accent);color:var(--text)}
.kr.st-late .st,.kr.st-behind .st{font-weight:600}
#kBtn b{background:var(--accent-soft);border-radius:999px;padding:0 7px;font-weight:700;margin-left:4px}
#kBtn.done b{background:#d1fae5;color:#047857}
/* nápověda – zásuvka vlevo */
#help{position:fixed;top:0;left:0;bottom:0;width:min(440px,92vw);background:var(--panel);border-right:1px solid var(--line);box-shadow:8px 0 30px rgba(0,0,0,.18);z-index:320;display:none;flex-direction:column;font-size:13px}
#help.open{display:flex}
#help .hh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2)}
#help .hh b{font-size:15px}#help .hh .sp{flex:1}
#help .hh button{border:0;background:none;font-size:16px;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:5px}#help .hh button:hover{background:var(--bg);color:var(--text)}
#help .hs{padding:8px 12px}
#help .hs input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;background:var(--bg)}
#help .hs input:focus{outline:none;border-color:var(--accent)}
#help .hb{overflow:auto;padding:0 12px 20px}
#help details{border-top:1px solid var(--line2);padding:4px 0}
#help summary{cursor:pointer;font-weight:700;padding:6px 0;list-style:none;display:flex;align-items:center;gap:8px}
#help summary::before{content:"▸";color:var(--muted);font-size:11px}
#help details[open] summary::before{content:"▾"}
#help .hi{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:6px 0 8px;border-top:1px dashed var(--line2)}
#help .hi .ic{display:flex;align-items:center;justify-content:center;gap:3px;min-height:24px;flex-wrap:wrap;font-size:12px}
#help .hi p{margin:2px 0 0;color:var(--text);line-height:1.4}
#help .hi p .dm,#help .ic .dm{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line);background:var(--panel);color:transparent;font-size:10px;font-weight:700;vertical-align:-3px;box-sizing:border-box}
#help .dm.chk{background:#d1fae5;border-color:#34c38f;color:#047857}#help .dm.todo{background:var(--accent);border-color:var(--accent);color:#fff}
#help .qn{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:4px;border:1.5px dashed var(--line);color:var(--muted);font-size:11px;font-weight:700;font-style:normal;vertical-align:-3px;box-sizing:border-box}
#help .qn.on{background:#fff3b0;color:#7a5200;border:1px solid #e6c84f}
#help kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
.cdp.soon{background:var(--critical);color:#fff}
.cdp.past{background:#444;border-color:#444;color:#fff}
.col.mline{border-left:1px solid var(--line);}
.prow{position:absolute;left:0;right:0;height:var(--rowh);background:var(--bg)}
.bar{user-select:none;-webkit-user-select:none;position:absolute;height:24px;border-radius:2px;top:5px;color:#fff;font-size:12px;cursor:grab;touch-action:none;background:color-mix(in srgb,var(--c) 42%,var(--panel)) !important}
.bar:active{cursor:grabbing}
.bar .prog{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:2px 0 0 2px;pointer-events:none}
.bar .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.bar .h-l{left:0}.bar .h-r{right:0}
.bar .lbl{position:absolute;left:calc(100% + 8px);top:0;line-height:24px;color:var(--muted);white-space:nowrap;pointer-events:none;font-size:11.5px}
.bar .nml{position:absolute;right:calc(100% + 8px);top:0;line-height:24px;color:var(--muted);white-space:nowrap;pointer-events:none;font-size:12px}
.bar .nml b{font-weight:500}
.bar.grp .nml,.bar.grp .lbl{line-height:12px}
.bar.nol .nml{display:none}
.bar.nol .lbl b{display:inline}
.bar .lbl i{font-style:normal;color:var(--muted)}
.bar .in{display:none}
.bar.grp{height:12px;top:11px;border-radius:1px;background:var(--c) !important}
.bar.grp .lbl{line-height:10px;font-weight:600}
.bar.grp .prog{background:rgba(0,0,0,.22)}
.bar.grp .h{display:none}
.bar.ms{width:24px !important;height:24px;margin-left:-12px;background:transparent !important;border-radius:0}
.bar.ms::before{content:"";position:absolute;left:4px;top:4px;width:16px;height:16px;background:color-mix(in srgb,var(--c) 42%,var(--panel));transform:rotate(45deg);border-radius:2px}
.bar.ms.done::before{background:var(--c)}
.bar.crit:not(.done):not(.ms):not(.grp){background:var(--critical) !important}
.bar.crit:not(.done) .prog{background:var(--gc)}
.bar.crit.ms:not(.done)::before{background:var(--critical)}
.bar.ms.done::after{content:"✓";position:absolute;left:0;right:0;top:0;line-height:24px;text-align:center;color:#fff;font-size:13px;font-weight:700}
.bar.ms .h,.bar.ms .prog,.bar.ms .in{display:none}
.bar.ms .lbl{left:calc(100% + 4px);top:0;line-height:24px}
.bar.ms .nml{right:calc(100% + 4px);line-height:24px}
.bar.psum{height:6px;border-radius:3px;cursor:default;background:var(--c) !important}
.bar.psum .h,.bar.psum .prog,.bar.psum .in,.bar.psum .lbl{display:none}
.deps{position:absolute;inset:0;pointer-events:none;overflow:visible}
.deps path{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:.55}
.deps path.bad{stroke:var(--critical);opacity:.8}
.deps polygon{fill:var(--muted);opacity:.55}
.deps polygon.bad{fill:var(--critical);opacity:.8}
.gantt.depshi .deps path{stroke:var(--accent);stroke-width:2;stroke-dasharray:none;opacity:.95}
.gantt.depshi .deps path.bad{stroke:var(--critical)}
.gantt.depshi .deps polygon{fill:var(--accent);opacity:.95}
.gantt.depshi .deps polygon.bad{fill:var(--critical)}
.gantt.depshi .bar .lbl,.gantt.depshi .bar .nml{opacity:.35}
.empty{padding:40px;color:var(--muted);max-width:480px}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.dh button{border:0;background:none;font-size:18px;color:var(--muted)}
.db{padding:14px 18px;display:grid;gap:12px;max-height:70vh;overflow:auto}
.f{display:grid;gap:4px}
.f label{color:var(--muted);font-size:12px}
.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%;font:inherit;color:inherit;resize:vertical}
.f textarea:focus{outline:none;border-color:var(--accent)}
.team a{color:var(--accent);text-decoration:none;padding:0 4px}
.f input[type=text],.f input[type=date],.f input[type=number],.f select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%}
.f input:focus,.f select:focus{outline:none;border-color:var(--accent)}
.f2{display:grid;grid-template-columns:1fr 1fr 90px;gap:10px}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:26px;height:26px;border-radius:6px;border:2px solid transparent;padding:0}
.sw button.on{border-color:var(--text);box-shadow:0 0 0 2px var(--panel) inset}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;user-select:none}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.chip input{display:none}
.fx{display:flex;gap:14px;flex-wrap:wrap}
.fx label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text);font-size:13px}
.df{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);justify-content:flex-end;align-items:center}
.df .left-actions{margin-right:auto;display:flex;gap:6px}
.btn.danger{color:var(--critical);border-color:transparent}
.team{display:grid;gap:6px}
.team div{display:flex;gap:6px;align-items:center}
.team input{flex:1}
.team button{border:0;background:none;color:var(--muted)}
.hint{color:var(--muted);font-size:12px}
@media (max-width:760px){ :root{--leftw:min(60vw,320px)} .brand{display:none} }

.lhead,.lrow{grid-template-columns:44px minmax(180px,1fr) 96px 74px 76px 28px}
.narrow .lhead,.narrow .lrow{grid-template-columns:44px 1fr 0 0 0 28px}
/* skrytá tabulka: jen Gantt */
.gantt.noleft{--leftw:0px}
.gantt.noleft .left,.gantt.noleft .splitter{display:none}
.btn.tog{color:var(--muted)}
.btn.tog.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
body.nostrip #strip{display:none}
.narrow .c-resp,.narrow .c-prog,.narrow .c-st{display:none}
.st{display:inline-block;font-size:11px;padding:1px 6px;border-radius:999px;white-space:nowrap}
.st.late{background:var(--critical);color:#fff}
.st.behind{background:#fdba74;color:#1b222c}
.bar.behind:not(.ms){outline:1px dashed #d97706;outline-offset:2px}
.bar .lbl i.dt.behind{color:#b45309;font-weight:600}
.st.stalled{background:#f59e0b;color:#1b222c}
.st.soon{background:var(--accent-soft);color:var(--text)}
.st.done{color:#1a7f3c;border:1px solid #6fcf97;background:color-mix(in srgb,#6fcf97 14%,transparent)}
.lrow.done .nm{color:var(--muted)}
.lrow.done .c-n{color:color-mix(in srgb,var(--muted) 60%,transparent)}
.ic{color:var(--muted);font-size:11px;flex:none;cursor:pointer;opacity:.8}
.ic:hover{opacity:1}
.st.active{color:var(--muted)}
.bar.late:not(.ms){outline:1px dashed var(--critical);outline-offset:2px}
.bar.late.ms::before{outline:1px dashed var(--critical);outline-offset:2px}
.bar .lbl i.dt.late{color:var(--critical);font-weight:600}
/* denní kontrola (jen vedoucí): prázdný šedý čtvereček za barem → ✓ zelená (dnes zkontrolováno) → ☐ modrá (v ToDo) → prázdný */
.bar .lbl i.dm{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;font-style:normal;font-weight:700;font-size:11px;line-height:1;margin-right:7px;border-radius:4px;vertical-align:middle;position:relative;top:-1px;pointer-events:auto;cursor:pointer;border:1.5px solid var(--line);background:var(--panel);color:transparent;box-sizing:border-box}
.bar .lbl i.dm:hover{border-color:var(--muted)}
.bar .lbl i.dm.auto{pointer-events:none;cursor:default;border-style:dashed}
/* rychlá poznámka za čtverečkem */
.bar .lbl i.qn{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;font-style:normal;font-size:13px;font-weight:700;line-height:1;margin-right:7px;border-radius:4px;vertical-align:middle;position:relative;top:-1px;pointer-events:auto;cursor:pointer;box-sizing:border-box;border:1.5px dashed var(--line);color:var(--muted);background:var(--panel)}
.bar .lbl i.qn:hover{border-color:var(--muted);color:var(--text)}
.bar .lbl i.qn.on{background:#fff3b0;color:#7a5200;border:1px solid #e6c84f}
:root[data-theme="dark"] .bar .lbl i.qn.on{background:#4a3d12;color:#ffd666;border-color:#7a6420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar .lbl i.qn.on{background:#4a3d12;color:#ffd666;border-color:#7a6420}}
#qn{position:fixed;z-index:450;display:none;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;box-shadow:0 8px 24px rgba(0,0,0,.18);width:330px}
#qn input{flex:1;border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:13px;background:var(--bg)}
#qn input:focus{outline:none;border-color:var(--accent)}
#qn button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px}
#qn button:hover{color:var(--critical)}
.bar .lbl i.dm.auto.chk{border-style:solid}
.bar .lbl i.dm.chk{background:#d1fae5;border-color:#34c38f;color:#047857}
.bar .lbl i.dm.chk.d1{opacity:.6}
.bar .lbl i.dm.chk.d2{opacity:.3}
.bar .lbl i.dm.todo{background:var(--accent);border-color:var(--accent);color:#fff}
.bar .lbl i.dm.todo.over{background:var(--critical);border-color:var(--critical)}
:root[data-theme="dark"] .bar .lbl i.dm.chk{background:#114d3a;border-color:#2f9c73;color:#6ee7b7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar .lbl i.dm.chk{background:#114d3a;border-color:#2f9c73;color:#6ee7b7}}
.bar.done{}
.strip{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.strip .lg{color:var(--muted);font-size:12px;margin-right:2px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;display:inline-flex;gap:6px;align-items:center;font-size:12px}
.pill b{font-weight:600}
.pill.on{background:var(--accent-soft);border-color:var(--accent)}
.pill .pd{width:9px;height:9px;border-radius:3px;display:inline-block}
.pill.late b{color:var(--critical)}
.pill.zero{opacity:.55}
.sepv{width:1px;height:18px;background:var(--line);margin:0 4px}
.quick{display:flex;gap:6px;align-items:center;flex:1;min-width:220px}
.quick input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 10px;min-width:0}
.quick input:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.log{display:grid;gap:6px;max-height:220px;overflow:auto}
.log div{background:var(--bg);border-radius:6px;padding:6px 9px}
.log div b{color:var(--muted);font-weight:500;font-size:11px;margin-right:6px}
.log div button{float:right;border:0;background:none;color:var(--muted)}
.logadd{display:flex;gap:6px}
.logadd textarea{flex:1}
.lrow .nt{cursor:pointer}
.head .hint{font-weight:400}
.lrow.head{background:var(--bg);font-weight:600}
.c-name .cl{color:var(--muted);font-size:11px;font-weight:400}
@media (max-width:760px){ .lhead,.lrow{grid-template-columns:26px 1fr 0 0 0 28px} .c-resp,.c-prog,.c-st{display:none} .quick{order:9;flex-basis:100%} }

.st.risk{background:#fde68a;color:#1b222c}
.pill.risk b{color:#b45309}
.tdc{border:1px solid var(--line);background:none;border-radius:999px;font-size:11px;padding:0 7px;color:var(--muted);flex:none;line-height:17px;white-space:nowrap}
/* otevřené položky: výrazný modrý štítek; po termínu: červený; vše hotovo: tichý šedý */
.tdc.open{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tdc.bad{background:var(--critical);border-color:var(--critical);color:#fff;font-weight:600}
.tdc.open:hover,.tdc.bad:hover{filter:brightness(1.12)}
.tdc.empty{visibility:hidden}
.lrow:hover .tdc.empty{visibility:visible}
.lrow.todo{background:color-mix(in srgb,var(--bg) 60%,transparent)}
.lrow.todo .c-name{gap:6px}
.lrow.todo .ind2{width:44px;flex:none}
.lrow.todo .ind2{width:calc(44px + var(--lv,0)*22px)}
.lrow.todo input[type=checkbox]{margin:0;flex:none;width:15px;height:15px;accent-color:var(--accent)}
.lrow.todo .tt{font-weight:400;font-size:13px}
.lrow.todo.done .tt{text-decoration:line-through;color:var(--muted)}
.blk{border:0;background:none;color:var(--line);padding:0 2px;font-size:12px;flex:none}
.blk.on{color:var(--critical)}
.lrow.todo:hover .blk{color:var(--muted)}
.lrow.todo:hover .blk.on{color:var(--critical)}
.lrow.todo input[type=date]{font-size:11px;padding:2px}
.lrow.todo.over:not(.done) input[type=date]{color:var(--critical);font-weight:600}
.lrow.todoadd input{color:var(--muted)}
.lrow.inbox .nm{font-weight:500;color:var(--muted)}
.tdot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--panel);border:2px solid var(--muted);z-index:2;pointer-events:auto;cursor:default}
.tdot.over{border-color:var(--critical);background:var(--critical)}
.tdot.done{border-color:var(--line);opacity:.6}
.tdot.blk{border-width:3px}
.tdot.sub{width:12px;height:12px;border-radius:2px;transform:rotate(45deg);border-width:2px;background:var(--panel)}
.tdot.sub.done{background:var(--muted);border-color:var(--muted);opacity:1}
.tdot.sub.over{background:var(--critical);border-color:var(--critical)}
.sublbl{position:absolute;line-height:34px;font-size:11.5px;color:var(--muted);white-space:nowrap;pointer-events:none}
.sublbl.done{text-decoration:line-through;opacity:.7}
.todol{display:grid;gap:4px}
.todol div{display:flex;gap:6px;align-items:center}
.todol input[type=text]{flex:1}
.todol input[type=date]{width:130px}
.todol select{width:110px}
.todol button{border:0;background:none;color:var(--muted)}
.todol .done input[type=text]{text-decoration:line-through;color:var(--muted)}

dialog.wide{width:min(980px,96vw)}
dialog.proj{width:min(760px,96vw)}
.deplist div{flex-wrap:wrap}
.deplist div>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.roles{margin-left:0}
.roles div span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roles div select{flex:none;max-width:150px}
.team input[type=text]{min-width:0}
.dump textarea{width:100%;min-height:220px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;font:inherit;color:inherit;resize:vertical;line-height:1.5}
.dump textarea:focus{outline:none;border-color:var(--accent)}
.tri{display:grid;gap:4px}
.tri .r{display:grid;grid-template-columns:22px 1fr 150px 150px 110px 130px 52px 26px 26px 22px;gap:5px;align-items:center}
.tri .r.hd{color:var(--muted);font-size:11px}
.tri .r.h{background:var(--bg);border-radius:6px;padding:4px 6px;font-weight:600;grid-template-columns:1fr}
.tri input[type=text],.tri select,.tri input[type=date]{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:4px 6px;width:100%;min-width:0;font-size:12px}
.tri input[type=text]{font-size:13px}
.tri button{border:1px solid transparent;background:none;border-radius:5px;padding:2px 0;font-size:13px;color:var(--line)}
.tri button.on{color:#d97706}
.tri button.blk.on{color:var(--critical)}
.tri button.rm{color:var(--muted)}
.tri .dq{display:flex;gap:3px}
.tri .dq input{flex:1}
.pr{display:inline-block;font-size:10px;font-weight:600;border-radius:4px;padding:0 4px;line-height:15px;flex:none}
.pr.p1{background:var(--critical);color:#fff}.pr.p2{background:var(--accent-soft);color:var(--text)}.pr.p3{color:var(--muted);border:1px solid var(--line)}
.imp{border:0;background:none;color:var(--line);padding:0 2px;flex:none;font-size:13px}
.imp.on{color:#d97706}
.lrow.todo:hover .imp{color:var(--muted)}.lrow.todo:hover .imp.on{color:#d97706}
.lrow.todo select.prs{width:52px;font-size:11px;padding:2px}
.dlgtabs{display:flex;gap:4px;margin-bottom:4px}
.dlgtabs button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px}
.dlgtabs button.on{background:var(--accent-soft);border-color:var(--accent)}
@media (max-width:760px){.tri .r{grid-template-columns:22px 1fr 26px 22px}.tri .r>*:nth-child(n+3):nth-child(-n+7){display:none}}

.ctx{position:fixed;z-index:100;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:210px;box-shadow:0 8px 24px rgba(0,0,0,.16);display:none}
.ctx.open{display:block}
.ctx button{width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:5px;display:flex;justify-content:space-between;gap:12px}
.ctx button:hover{background:var(--bg)}
.ctx button:disabled{opacity:.4}
.ctx button kbd{color:var(--muted);font-size:11px;font-family:inherit}
.ctx .sep{border-top:1px solid var(--line);margin:4px 0}
.ctx button.danger{color:var(--critical)}
.lrow.sel{background:var(--accent-soft) !important}
.lrow .c-n{cursor:grab;touch-action:none;user-select:none}
.lrow.dragsrc{opacity:.35}
.dropline{position:absolute;height:0;border-top:2px solid var(--accent);pointer-events:none;z-index:6;display:none}
.dropline::before{content:"";position:absolute;left:-5px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.dragghost{position:fixed;z-index:400;pointer-events:none;background:var(--panel);border:1px solid var(--accent);border-radius:6px;padding:4px 10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.18);white-space:nowrap}
.deplist{display:grid;gap:4px}
.deplist div{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:6px;padding:4px 8px}
.deplist div span{flex:1}
.deplist div button{border:0;background:none;color:var(--muted)}

/* plovoucí panel ToDo – pravý horní roh, kompaktní */
#todoBtn{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;padding:6px 12px;display:inline-flex;align-items:center;gap:6px}
#todoBtn b{background:rgba(255,255,255,.22);border-radius:999px;padding:0 7px;font-weight:700;line-height:18px}
#todoBtn i.ov{font-style:normal;background:var(--critical);border-radius:999px;padding:0 6px;font-size:11px;line-height:18px}
#todoBtn.on{background:#174a99;border-color:#174a99}
#tp{position:fixed;top:52px;right:10px;z-index:300;width:clamp(360px,30vw,560px);max-height:calc(100vh - 64px);display:none;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.22);font-size:13px}
#tp.open{display:flex}
#tp.min{display:flex;width:auto;max-height:none}
#tp .tph{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--line2)}
#tp.min .tph{border:0;padding:4px 6px 4px 10px}
#tp .tph b{font-size:14px}
#tp .tph .sub{color:var(--muted);font-size:12px}
#tp .tph .sp{flex:1}
#tp .tph button{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:2px 7px;border-radius:5px;cursor:pointer}
#tp .tph button:hover{background:var(--bg);color:var(--text)}
#tp .tph .tpt{font-size:13px;color:var(--text);font-weight:600;padding:4px 6px}
#tp .tph .ov{color:var(--critical);font-weight:600}
#tp .tpsub{color:var(--muted);font-size:11.5px;padding:6px 12px 0}
#tp .tpsub a{color:var(--accent);cursor:pointer;text-decoration:none}
#tp .dsec{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
#tp .dadd{display:flex;gap:6px;align-items:center;padding:8px 10px 6px 12px}
#tp .dadd input{flex:1;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:6px 8px;font-size:13px}
#tp .dadd.head input{font-weight:700}
#tp .dadd input:focus{outline:none;border-color:var(--accent)}
#tp .hb{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;background:none;color:var(--muted);cursor:pointer;flex:none}
#tp .hb.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
#tp .tpl{overflow:auto;padding:2px 6px 10px}
#tp .di{display:flex;align-items:center;gap:4px;padding:3px 2px;position:relative;border-radius:5px}
#tp .di:hover{background:var(--bg)}
#tp .di .grab{width:14px;flex:none;color:transparent;cursor:grab;font-size:13px;line-height:1;text-align:center;user-select:none;touch-action:none}
#tp .di:hover .grab{color:var(--line)}
#tp .di.dragsrc{opacity:.35}
#tp .di .star,#tp .di .pri{border:0;background:none;padding:0;width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:4px}
#tp .di .star{font-size:14px;color:var(--line)}
#tp .di .star:hover{color:#c99400}
#tp .di .star.on{color:#e6a700}
#tp .di .pri{color:#e0881a}
#tp .di.p0 .pri{color:var(--line)}
#tp .di.p0 .pri:hover{color:var(--muted)}
#tp .di.p1 .pri{color:var(--critical)}
#tp .di.p3 .pri{color:#3aa355}
#tp .di .chk{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line);flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;font-size:10px;font-weight:700;background:var(--panel);margin:0 3px 0 1px}
#tp .di .chk:hover{border-color:#e6a700}
#tp .di.done .chk{background:#f2b335;border-color:#f2b335;color:#fff}
#tp .di .body{flex:1;min-width:0}
#tp .di .line{display:flex;align-items:center;gap:6px;min-width:0}
#tp .di .dtext{flex:1 1 auto;min-width:40px;border:1px solid transparent;background:transparent;border-radius:4px;padding:1px 3px;margin-left:-3px;font-size:13px;line-height:1.3}
#tp .di .dtext:focus{outline:none;border-color:var(--accent);background:var(--panel)}
#tp .di.done .dtext{text-decoration:line-through;color:var(--muted)}
#tp .di.done .star,#tp .di.done .pri{opacity:.35;pointer-events:none}
#tp .di.head{margin-top:8px}
#tp .di.head .dtext{font-weight:700}
#tp .di.head .grab{margin-right:60px}
#tp .di .pill{padding:0 6px;font-size:10.5px;color:var(--muted);flex:none;line-height:16px}
#tp .di .pill.over{color:var(--critical);border-color:var(--critical)}
#tp .di .tag{font-size:10.5px;color:var(--muted);flex:none;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tp .di .ring{flex:none}
#tp .di .ringw{flex:none;display:inline-flex;cursor:help}
#tp .di .pdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
#tp .di .dopt{border:0;background:none;color:transparent;padding:0 5px;border-radius:4px;flex:none;font-size:14px;cursor:pointer}
#tp .di:hover .dopt,#tp .di.open .dopt{color:var(--muted)}
#tp .di .dopt.x{font-size:12px}
#tp .dopts{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;padding:2px 4px 8px 70px;font-size:11.5px}
#tp .dopts label{color:var(--muted);display:flex;align-items:center;gap:4px}
#tp .dopts select,#tp .dopts input[type=date]{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:3px 5px;font-size:11.5px;max-width:170px}
#tp .dopts .seg button{padding:2px 7px;font-size:11.5px}
#tp .dopts .btn{padding:2px 7px;font-size:11.5px}
#tp .dempty{color:var(--muted);padding:8px 6px;font-size:12.5px}
@media (max-width:760px){#tp{left:6px;right:6px;width:auto;top:48px}}
.lrow.todo.thead .tt{font-weight:700}

#auth{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
#auth form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 28px;width:min(400px,100%);display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
#auth h1{margin:0;font-size:22px}
#auth .f input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--panel);padding:9px 16px;border-radius:8px;z-index:300;font-size:13px;display:none;max-width:90vw}
#toast.err{background:var(--critical);color:#fff}
.brand .hint{font-weight:400;font-size:12px;margin-left:6px}

.qm{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#d97706;color:#fff;font-size:11px;font-weight:700;flex:none;cursor:help}
.bar.unclear:not(.ms){outline:2px dotted #d97706;outline-offset:2px}
.bar.unclear.ms::before{outline:2px dotted #d97706;outline-offset:2px}
.bar.unclear .nml::before,.bar.unclear .lbl b::before{content:"? ";color:#d97706;font-weight:700}
.st.unclear{background:#fde68a;color:#1b222c}
.pill.unclear b{color:#b45309}

#draftbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 12px;background:#eef2ff;border-bottom:2px solid #3f51b5;font-size:13px}
#draftbar.on{display:flex}
#draftbar b{color:#3f51b5}
#draftbar input{flex:1;min-width:200px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px}
#draftbar .stat{color:var(--muted)}
:root[data-theme="dark"] #draftbar{background:#232a44}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #draftbar{background:#232a44}}
.gantt.draft .left{border-right-color:#3f51b5}
.lrow.pnew .nm{color:#1a7f3c}
.pmark{font-size:10px;border-radius:3px;padding:0 4px;flex:none;font-weight:600}
.pmark.new{background:#d1fae5;color:#166534}
.pmark.chg{background:#fef3c7;color:#92400e}
.gantt.ro input,.gantt.ro select,.gantt.ro .tg,.gantt.ro .tdc,.gantt.ro .c-n{pointer-events:none}
.gantt.ro .bar{cursor:default}
.gantt.ro .c-act{visibility:hidden}
.pill.draft{border-color:#3f51b5;color:#3f51b5}
.pill.draft.on{background:#3f51b5;color:#fff}
.roles{display:grid;gap:4px;margin:4px 0 0 12px}
.roles div{display:flex;gap:8px;align-items:center;font-size:12px}
.roles div span{flex:1;color:var(--muted)}
body.proposer #todoBtn,body.proposer #by,body.proposer #quick,body.proposer .tab[data-p="__new"],body.proposer .tab[data-p="ALL"],body.proposer #menu li:has([data-m="newproj"]),body.proposer #menu li:has([data-m="import"]),body.proposer #menu li:has([data-m="gpro"]),body.proposer #menu li:has([data-m="dump"]),body.proposer #menu li:has([data-m="proj"]),body.proposer #menu li:has([data-m="autodaily"]),body.proposer #menu li:has([data-m="wipe"]),body.proposer #person,body.proposer .strip [data-st]{display:none !important}
.vers{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 6px;font-size:12px;max-width:260px}
.vdiff{display:grid;gap:4px;font-size:13px}
.vdiff div{padding:4px 8px;border-radius:5px;background:var(--bg)}
.vdiff .add{border-left:3px solid #1a7f3c}.vdiff .del{border-left:3px solid var(--critical)}.vdiff .chg{border-left:3px solid #d97706}
.gantt.viewver .left{border-right-color:#d97706}

.lrow.chg{box-shadow:inset 4px 0 0 #e6b800}
.chgtag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;background:#fff3c4;color:#7a5200;border-radius:4px;padding:1px 6px;flex:none;cursor:pointer;white-space:nowrap}
.chgtag:hover{background:#ffe88a}
:root[data-theme="dark"] .chgtag{background:#4a3d12;color:#ffd666}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chgtag{background:#4a3d12;color:#ffd666}}
/* změna termínu (nepřečtená): původní rozsah = oranžový čárkovaný rámeček nad barem, ubrané dny šrafované, přidané dny oranžový proužek */
.chgold{position:absolute;height:24px;border:1.5px dashed #d97706;border-radius:2px;box-sizing:border-box;z-index:3;pointer-events:none;background:transparent}
.chgcut{position:absolute;height:24px;z-index:3;box-sizing:border-box;border-radius:2px;background:repeating-linear-gradient(135deg,rgba(217,119,6,.55) 0 3px,transparent 3px 7px);pointer-events:none}
.chgadd{position:absolute;height:24px;z-index:3;box-sizing:border-box;border-top:3px solid #d97706;border-bottom:3px solid #d97706;background:transparent;pointer-events:none}
.bar .lbl i.chgd{pointer-events:auto;cursor:help;color:#b45309;font-weight:600;background:#fff3c4;border-radius:4px;padding:0 5px}
:root[data-theme="dark"] .bar .lbl i.chgd{background:#4a3d12;color:#ffd666}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar .lbl i.chgd{background:#4a3d12;color:#ffd666}}
.pill.chg b{color:#b45309}
.hist{display:grid;gap:4px;font-size:12.5px}
.hist div{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:6px;padding:5px 8px}
.hist div .w{color:var(--muted);flex:none;min-width:120px}
.hist div .x{flex:1}
.hist div.unread{box-shadow:inset 3px 0 0 #e6b800}
.hist div button{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:2px 8px;font-size:11px;color:var(--muted)}
#tip{position:fixed;z-index:500;background:var(--text);color:var(--panel);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.4;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:none;display:none;white-space:pre-line}
#tip b{color:#ffd666}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand" title="verze 1.10.1">Projekty <span class="hint" id="who"></span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="tools">
    <div class="seg" id="by"><button data-b="project">Harmonogram</button><button data-b="person">Podle lidí</button></div>
    <div class="seg" id="zoom"><button data-z="day">Den</button><button data-z="week">Týden</button><button data-z="month">Měsíc</button></div>
    <button class="btn" id="bToday">Dnes</button>
    <div class="menu" id="menu"><button class="btn">⋯</button>
      <ul>
        <li><button data-m="proj">Nastavení projektu, tým a skupiny</button></li>
        <li><button data-m="newproj">Nový projekt</button></li>
        <li class="sep"></li>
        <li><button data-m="leftw">Levá tabulka: <b id="leftwL"></b></button></li>
        <li><button data-m="strip">Lišta rychlých filtrů: <b id="stripL"></b></button></li>
        <li class="sep"></li>
        <li><button data-m="autodaily">Ráno otevírat ToDo: <b id="autodailyL"></b></button></li>
        <li><button data-m="bartip">Bublina s údaji u názvu úkolu a baru: <b id="bartipL"></b></button></li>
        <li><button data-m="track">Sledování změn: <b id="trackL"></b></button></li>
        <li class="sep"></li>
        <li><button data-m="export">Export JSON (záloha)</button></li>
        <li><button data-m="import">Import JSON (např. z prototypu)</button></li>
        <li><button data-m="gpro">Import z GanttPRO (export .xlsx)</button></li>
        <li class="sep"></li>
        <li><button data-m="dump">Hromadný seznam ToDo a třídění</button></li>
        <li><button data-m="name">Moje jméno</button></li>
        <li><button data-m="pwd">Změnit heslo</button></li>
        <li><button data-m="logout">Odhlásit</button></li>
        <li><button data-m="diag">Diagnostika připojení</button></li>
        <li><button data-m="wipe" class="danger">Smazat všechna data</button></li>
      </ul>
    </div>
    <button class="btn" id="helpBtn" title="Nápověda (?)">?</button>
    <button class="btn" id="kBtn">Kontrola</button>
    <span id="cd"></span>
    <button class="btn todo" id="todoBtn">ToDo</button>
    <input type="file" id="file" accept="application/json" hidden>
    <input type="file" id="xfile" accept=".xlsx" hidden>
  </div>
</header>
<div class="strip" id="strip"></div>
<div id="draftbar"></div>
<main class="gantt" id="gantt"></main>

<dialog id="tdlg"></dialog>
<div class="ctx" id="ctx"></div>
<div id="auth" style="display:none"><form id="authform" data-mode="login"><h1>Projekty</h1><p class="hint">Řízení projektů ÚRÚ ČR — harmonogramy a ToDo</p>
  <div class="f" id="unamef" style="display:none"><label>Jméno (jak chcete být uvedeni v týmech projektů)</label><input type="text" name="uname"></div>
  <div class="f"><label>E-mail</label><input type="email" name="email" required autocomplete="username"></div>
  <div class="f"><label id="pwlabel">Heslo</label><input type="password" name="password" required autocomplete="current-password" minlength="6"></div>
  <button type="submit" class="btn pri" id="authsubmit">Přihlásit</button>
  <div class="fx" style="justify-content:space-between;margin-top:6px"><button type="button" class="btn" id="authmode" style="border:0">Nemám účet – zaregistrovat</button><button type="button" class="btn" id="authreset" style="border:0">Zapomenuté heslo</button></div>
  <div class="hint" id="authmsg"></div></form></div>
<dialog id="pdlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js?v=1.10.1"></script>
<script src="db.js?v=1.10.1"></script>
<script src="app.js?v=1.10.1"></script>
</body>
</html>
